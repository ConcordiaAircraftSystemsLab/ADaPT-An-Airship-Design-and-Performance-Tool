[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "airship-design-tool"
version = "1.0.0"
description = "Conceptual multidisciplinary design and analysis tool for hybrid-power airships based on OpenMDAO."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Musavir" }
]

keywords = [
    "airship",
    "aircraft design",
    "MDO",
    "OpenMDAO",
    "hydrogen",
    "fuel cell",
    "hybrid electric propulsion"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Aerospace Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy==2.2.6",
    "scipy==1.16.2",
    "pandas==2.3.3",
    "matplotlib==3.10.7",
    "openmdao==3.42.0",
    "pymoo==0.6.1.6",
    "colorama==0.4.6",
    "openpyxl",
    "CoolProp==8.0.0",
    "pyxdsm==2.3.1",
    "xlsxwriter==3.2.9",
    "plotly==6.5.2",
    "seaborn==0.13.2",
    "networkx==3.6.1",
    "SALib==1.5.2",
    "sympy==1.14.0",
    "tabulate==0.9.0",
    "tqdm==4.67.1",
	"streamlit==1.52.2",
]


[project.urls]
Homepage = "https://github.com/your_username/airship-design-tool"
Documentation = "https://github.com/your_username/airship-design-tool"
Repository = "https://github.com/your_username/airship-design-tool"


[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "studies*",
    "validation*"
]
